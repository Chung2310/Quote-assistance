name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API and web app
        run: yarn build

      - name: Test deployment validation and rollback
        run: |
          node --test scripts/prepare-deploy.test.mjs scripts/redact-container-logs.test.mjs scripts/resolve-mongo-network.test.mjs
          bash scripts/deploy-vps.test.sh

  publish-image:
    name: Publish Docker image to GHCR
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.metadata.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

  deploy:
    name: Deploy branch to VPS
    needs: publish-image
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - name: Deploy and verify container
        shell: bash
        env:
          SSH_HOST: ${{ secrets[github.ref_name == 'production' && 'SSH_HOST_PROD' || 'SSH_HOST'] }}
          SSH_USER: ${{ secrets[github.ref_name == 'production' && 'SSH_USER_PROD' || 'SSH_USER'] }}
          SSH_KEY: ${{ secrets[github.ref_name == 'production' && 'SSH_KEY_PROD' || 'SSH_KEY'] }}
          SSH_PORT: ${{ secrets[github.ref_name == 'production' && 'SSH_PORT_PROD' || 'SSH_PORT'] || '22' }}
          ENV_FILE: ${{ vars[github.ref_name == 'production' && 'ENV_FILE_PROD' || 'ENV_FILE'] || secrets[github.ref_name == 'production' && 'ENV_FILE_PROD' || 'ENV_FILE'] }}
          IMAGE: ${{ needs.publish-image.outputs.image }}@${{ needs.publish-image.outputs.digest }}
          IMAGE_TAG: ${{ needs.publish-image.outputs.image }}:${{ needs.publish-image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-ssh.sh
